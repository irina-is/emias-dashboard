server.port=8081
server.servlet.context-path=/

# Bcrypt-хэш пароля. Сгенерировать новый: htpasswd -bnBC 10 "" ПАРОЛЬ | tr -d ':\n'
deploy.password=$2y$10$pXV2.lBvHIxg7I1yaWwcYeViZuMr/eJqp8wVybSZlTqxdqR109jXW

# Путь до JAR основного приложения на сервере
