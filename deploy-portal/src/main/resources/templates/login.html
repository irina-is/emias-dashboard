<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sign in · Deploy Portal</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #1f2328;
            background: #f6f8fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .logo { margin-bottom: 16px; }
        .logo svg { width: 48px; height: 48px; fill: #1f2328; }
        h1 { font-size: 24px; font-weight: 300; letter-spacing: -0.5px; margin-bottom: 16px; text-align: center; }
        .card {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 20px;
            width: 100%;
            max-width: 340px;
        }
        .flash {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .flash-error { background: #ffebe9; border: 1px solid #f1998e; color: #82071e; }
        .flash-success { background: #dafbe1; border: 1px solid #aceebb; color: #116329; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
        input[type=text], input[type=password] {
            display: block;
            width: 100%;
            padding: 5px 12px;
            font-size: 14px;
            line-height: 20px;
            color: #1f2328;
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            height: 32px;
        }
        input:focus {
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9,105,218,.3);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 5px 16px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            text-align: center;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid rgba(31,35,40,.15);
            border-radius: 6px;
            color: #ffffff;
            background: #1f883d;
            transition: background .2s;
            height: 32px;
        }
        .btn:hover { background: #1a7f37; }
        .footer { margin-top: 16px; text-align: center; font-size: 12px; color: #57606a; }
    </style>
</head>
<body>
    <div class="logo">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                     0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
                     -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
                     .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
                     -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
                     .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
                     .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
                     0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
    </div>

    <h1>Войдите в Deploy Portal</h1>

    <div class="card">
        <div th:if="${param.error}" class="flash flash-error">
            Неверный логин или пароль.
        </div>
        <div th:if="${param.logout}" class="flash flash-success">
            Вы успешно вышли из системы.
        </div>

        <form method="post" action="/login">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="current-password"/>
            </div>
            <button type="submit" class="btn">Войти</button>
        </form>
    </div>

    <div class="footer">Deploy Portal &copy; 2026</div>
</body>
</html>
