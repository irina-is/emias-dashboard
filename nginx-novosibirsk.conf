server {
    listen 80;
    listen [::]:80;

    # Java-приложение (Spring Boot, порт 8081) — зеркалит прод
    location /spec/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8081/;
    }

    # Деплой-портал (порт 8082)
    location /deploy/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8082/;
        client_max_body_size 200M;
    }
}
